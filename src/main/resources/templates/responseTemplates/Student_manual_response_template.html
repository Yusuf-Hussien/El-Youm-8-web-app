<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتيجة الطالب</title>
<!--    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700&amp;display=swap" rel="stylesheet"/>-->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans Arabic', sans-serif;
        }
    </style>
    <style>
        body {
            font-family: 'Noto Sans Arabic', sans-serif;
            background-color: #f3f4f6; /* bg-gray-100 */
            display: flex; /* flex */
            align-items: center; /* items-center */
            justify-content: center; /* justify-center */
            min-height: 100vh; /* min-h-screen */
            margin: 0;
            padding: 0;
        }

        .container {
            background-color: #ffffff; /* bg-white */
            padding: 2rem; /* p-8 */
            border-radius: 0.5rem; /* rounded-lg */
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); /* shadow-lg */
            width: 100%; /* w-full */
            max-width: 28rem; /* max-w-md (448px) */
        }

        .title {
            font-size: 1.5rem; /* text-2xl */
            font-weight: 700; /* font-bold */
            text-align: center; /* text-center */
            color: #2563eb; /* text-blue-600 */
            margin-bottom: 1.5rem; /* mb-6 */
        }

        .list {
            list-style-type: none;
            margin-bottom: 1rem;
            padding-left: 0;
            line-height: 1.5; /* leading-relaxed */
            margin-top: 1rem;
        }

        .list li {
            margin-bottom: 1rem; /* space-y-4 */
        }

        .list li span {
            font-weight: 700; /* font-bold */
        }

        .footer {
            text-align: center; /* text-center */
            color: #6b7280; /* text-gray-500 */
            margin-top: 1.5rem; /* mt-6 */
        }

        @media print {
            .no-print {
                display: none;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1 class="title">نتيجة الطالب</h1>
    <ul class="list">
        <li><span>رقم الجلوس:</span> SEAT_NUMBER</li>
        <li><span>الاسم:</span> ARABIC_NAME</li>
        <li><span>المجموع:</span> TOTAL_DEGREE</li>
        <li><span>النسبة:</span> PERCENTAGE%</li>
        <li><span>الترتيب:</span> RANK</li>
        <li><span>الترتيب مكرر:</span> RANK_WITH_DUPLICATES</li>
    </ul>
    <p class="footer no-print">تم إنشاء هذا المستند بواسطة اليوم الثامن</p>
</div>
</body>
</html>
