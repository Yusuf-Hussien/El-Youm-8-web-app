<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>


<div th:replace="layout :: layout('Search by Seat Number', 'seat', ~{::div})">
  <div th:fragment="content">

  <!-- Form -->
  <form id="studentForm" method="post" th:action="@{/natega/searchWithSeatNumber}" th:object="${seatNumberForm}" >
    <div class="form-group">
      <label for="seatNumberInput">رقم الجلوس</label>
      <input type="text" th:field="*{seatNumber}" class="form-control" id="seatNumberInput" aria-describedby="emailHelp"
             placeholder="رقم الجلوس" required>
    </div>
    <button type="submit" class="btn btn-primary">بحث</button>
  </form>

  <!-- Form with-in validatitain using JS
  <form id="studentForm" method="get" th:object="${formData}" onsubmit="return updateFormAction()">
    <div class="form-group">
      <label for="seatNumberInput">رقم الجلوس</label>
      <input type="text" th:field="*{text}" class="form-control" id="seatNumberInput" aria-describedby="emailHelp"
             placeholder="رقم الجلوس" required>
    </div>
    <button type="submit" class="btn btn-primary">بحث</button>
  </form>-->


  <!-- With in style-->
  <!--<div style="background-color: #f0f0f0; padding: 20px;">
    <form id="studentForm" method="get" th:object="${formData}" onsubmit="return updateFormAction()">
      <div class="form-group" style="margin-bottom: 15px;">
        <label for="seatNumberInput" style="font-weight: bold;">رقم الجلوس</label>
        <input type="text" th:field="*{text}" class="form-control" id="seatNumberInput" aria-describedby="emailHelp"
               placeholder="رقم الجلوس" style="border: 2px solid #007bff; padding: 8px;">
      </div>
      <button type="submit" class="btn btn-primary" style="background-color: #007bff; color: white;">بحث</button>
    </form>
  </div>-->

  <!-- Student Result -->
  <div class="RightSide" th:if="${student}">
    <div class="halfinput-student">
      <h6>بيانات الطالب</h6>
    </div>
    <div class="data-result">
      <div class="halfinput-result">
        <div class="wrapper">
          <ul class="nav nav-pills mb-3 d-flex justify-content-center" id="pills-tab" role="tablist">
            <li class="col resultItem">
              <span class="formatt3">رقم الجلوس</span>
              <h1 th:text="${student.seatNumber}"></h1>
            </li>
            <li class="col resultItem">
              <span class="formatt3">مجموع الدرجات</span>
              <h1 th:text="${student.totalDegree}"></h1>
            </li>
            <li class="col resultItem">
              <span class="formatt3">النسبة المئوية</span>
              <h1 th:text="${student.percentage} + ' %'"></h1>
            </li>
          </ul>
        </div>
      </div>
    </div>
    <div class="clear"></div>
    <div class="full-result">
      <ul class="nav-pills mb-3" id="pills-tab" role="tablist">
        <li class="resultItem">
          <span class="formatt active" id="tab-list-active">الأسم:</span>
          <span th:text="${student.arabicName}"></span>
        </li>
        <li class="resultItem">
          <span class="formatt" id="tab">الترتيب:</span>
          <span th:text="${student.studentRank}"></span>
        </li>
        <li class="resultItem">
          <span class="formatt" id="tab">الترتيب مكرر:</span>
          <span th:text="${student.rankWithDuplicates}"></span>
        </li>
      </ul>
    </div>
  </div>

  <!-- Error Message -->
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <!-- JavaScript for Form Validation -->
  <script>
    function updateFormAction() {
      const seatNumber = document.getElementById('seatNumberInput').value;
      if (!seatNumber || !/^\d+$/.test(seatNumber)) {
        alert('Please enter a valid seat number (numeric only).');
        return false;
      }
      const form = document.getElementById('studentForm');
      form.action = '/natega/students/' + encodeURIComponent(seatNumber);
      return true;
    }
  </script>
</div>
</div>
</body>
</html>
