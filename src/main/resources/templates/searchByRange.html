<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title layout:title="Search by Seat Range">Search</title>
</head>

<body>
<section layout:fragment="content">
    <form method="post" th:action="@{/natega/searchByRange}" th:object="${seatNumbers}">
        <div class="form-group">
            <div class="d-flex gap-2">

                <input type="text" th:field="*{startSeatNumber}" name="startSeat" class="form-control" id="startSeat"
                       placeholder="رقم الجلوس الأول" required style="text-align: center">
                <!--<small th:if="${#fields.hasErrors('text')}" th:errors="*{startSeatNumber}" class="text-danger"></small>-->

                <button type="submit" class="btn btn-primary">بحث</button>

                <input type="text" th:field="*{endSeatNumber}" name="endSeat" class="form-control" id="endSeat"
                       placeholder="رقم الجلوس الأخير" required style="text-align: center">
                <!--<small th:if="${#fields.hasErrors('text')}" th:errors="*{endSeatNumber}" class="text-danger"></small>-->

            </div>
        </div>
    </form>

    <div th:if="${students}" th:replace="fragments/students-table :: studentsTableFragment(${students})"></div>

</section>
</body>
</html>
