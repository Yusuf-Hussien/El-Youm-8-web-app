<!DOCTYPE html>
<html lang="en" xmlns:th="http://thmyelead.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.5;
            color: #212529;
            text-align: right;
            background-color: #fff;
        }


        #studentTable {
            display: none;
            direction: rtl;
            border-collapse: collapse;
            margin-top: 1rem;
            width: 100%;
            max-width: 600px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #studentTable td {
            border: 1px solid #ccc;
            padding: 8px 12px;
        }

        #studentTable tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        #studentTable td:first-child {
            font-weight: bold;
            background-color: #f1f1f1;
            width: 30%;
            white-space: nowrap;
        }

        #showBtn {
            margin-top: 1rem;
            padding: 6px 16px;
            background-color: #008cba;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        #showBtn:hover {
            background-color: #0072a3;
        }
    </style>
</head>
<body>
<div>
    <div th:text="|${student.arabicName} : الاسم|"></div>
    <div th:text="|${student.totalDegree} : المجموع|"></div>
    <div th:text="|${student.percentage} : النسبة|"></div>
    <div th:text="|${student.studentRank} : الترتيب|"></div>
    <div th:text="|${student.rankWithDuplicates} : الترتيب مكرر|"></div>
</div>


<table id="studentTable">
    <tr>
        <td>الاسم</td>
        <td style="font-weight: bold;" th:text="${student.arabicName}"></td>
    </tr>
    <tr>
        <td>المجموع</td>
        <td style="color: #0a58ca;font-weight: bold;" th:text="${student.totalDegree}"></td>
    </tr>
    <tr>
        <td>النسبة</td>
        <td style="color: #0a58ca; font-weight: bold;" th:text="|${student.percentage}%|"></td>
    </tr>

    <tr>
        <td>الترتيب</td>
        <td th:text="${student.studentRank}"></td>
    </tr>
    <tr>
        <td>الترتيب مكرر</td>
        <td th:text="${student.rankWithDuplicates}"></td>
    </tr>
</table>

<!-- Button to Show Table -->
<button id="showBtn"
        onclick="document.getElementById('studentTable').style.display='table'; this.style.display='none';">
    عرض التفاصيل
</button>

</body>
</html>
