<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title layout:title="Search by Name">Search</title>
</head>
<body>
<section layout:fragment="content">

    <form id="studentForm" method="post" th:action="@{/natega/searchByName}" th:object="${formData}">
        <div class="form-group">
            <label for="arabicNameInput">الاسم</label>
            <input type="text" th:field="*{text}" class="form-control" id="arabicNameInput" placeholder="أدخل الاسم" required>
            <small th:if="${#fields.hasErrors('text')}" th:errors="*{text}" class="text-danger"></small>
        </div>
        <button type="submit" class="btn btn-primary">بحث</button>
    </form>


    <div th:if="${students}">
        <h6>نتائج البحث</h6>
        <table class="table">
            <thead>
            <tr>
                <th>رقم الجلوس</th>
                <th>الاسم</th>
                <th style="text-align: center;">مجموع الدرجات</th>
                <th style="text-align: center;">النسبة المئوية</th>
                <th style="text-align: center;">الترتيب</th>
                <th style="text-align: center;">الترتيب مكرر</th>

            </tr>
            </thead>
            <tbody>
            <tr th:each="student : ${students}">
                <td th:text="${student.seatNumber}"></td>
                <td th:text="${student.arabicName}"></td>
                <td th:text="${student.totalDegree}" style="text-align: center;"></td>
                <td th:text="${student.percentage} + ' %'" style="color: #0d6efd;font-weight: bold;text-align: center;"></td>
                <td th:text="${student.studentRank}" style="text-align: center;"></td>
                <td th:text="${student.rankWithDuplicates}" style="text-align: center;"></td>

            </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
