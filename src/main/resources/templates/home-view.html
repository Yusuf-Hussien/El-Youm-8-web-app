<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <title>Student Seat Number</title>
</head>
<body>

<!-- Side bar -->
<div class="d-flex flex-column flex-shrink-0 p-3 bg-body-tertiary"
     style="width: 280px; height: 100vh; position: fixed; right: 0; top: 0;">

    <svg class="bi pe-none me-2" width="40" height="32" aria-hidden="true">
        <use xlink:href="#bootstrap"></use>
    </svg>
    <span class="fs-4 fw-bold text-primary mx-auto">El-Youm 8</span>
    <hr>
    <ul class="nav nav-pills flex-column mb-auto">
        <li class="nav-item"><a href="#" class="nav-link active" aria-current="page">
            <svg class="bi pe-none me-2" width="16" height="16" aria-hidden="true">
                <use xlink:href="#home"></use>
            </svg>
            البحث برقم الجلوس
        </a></li>
        <li class="nav-item"><a href="#" class="nav-link">
            <svg class="bi pe-none me-2" width="16" height="16" aria-hidden="true">
                <use xlink:href="#table"></use>
            </svg>
            البحث بالاسم
        </a></li>
        <li class="nav-item"><a href="#" class="nav-link">
            <svg class="bi pe-none me-2" width="16" height="16" aria-hidden="true">
                <use xlink:href="#grid"></use>
            </svg>
            الترتيب
        </a></li>
        <li class="nav-item"><a href="#" class="nav-link">
            <svg class="bi pe-none me-2" width="16" height="16" aria-hidden="true">
                <use xlink:href="#people-circle"></use>
            </svg>
            بحث بين رقمين جلوس
        </a></li>
    </ul>
    <hr>
</div>

<script>
    document.querySelectorAll('.nav-pills .nav-link').forEach(link => {
        link.addEventListener('click', function () {
            document.querySelectorAll('.nav-pills .nav-link').forEach(item => item.classList.remove('active'));
            this.classList.add('active');
        });
    });
</script>



<!--form-->
<div class="container">
<form id="studentForm" method="get" th:object="${formData}" onsubmit="return updateFormAction()">
    <div class="form-group">
        <label for="seatNumberInput">رقم الجلوس</label>
        <input type="text" th:field="*{text}" class="form-control" id="seatNumberInput" aria-describedby="emailHelp"
               placeholder="رقم الجلوس">
    </div>
    <button type="submit" class="btn btn-primary" onclick="updateFormAction()">بحث</button>
</form>
</div>
<script>
    function updateFormAction() {
        const seatNumber = document.getElementById('seatNumberInput').value;
        if (!seatNumber || !/^\d+$/.test(seatNumber)) {
            alert('Please enter a valid seat number (numeric only).');
            return false;
        }
        const form = document.getElementById('studentForm');
        form.action = '/natega/students/' + encodeURIComponent(seatNumber);
        return true;
    }
</script>



<!--student result-->
<div class="RightSide">
    <div class="halfinput-student">
        <h6>بيانات الطالب</h6>
    </div>

    <div class="data-result">
        <div class="halfinput-result ">
            <div class="wrapper">
                <ul class="nav nav-pills mb-3 d-flex justify-content-center" id="pills-tab" role="tablist">
                    <li class="col resultItem">
                        <span class="formatt3">رقم الجلوس</span>
                        <h1>1859654</h1>
                    </li>
                    <li class="col resultItem">
                        <span class="formatt3">مجموع الدرجات</span>
                        <h1>191.00</h1>
                    </li>
                    <li class="col resultItem">
                        <span class="formatt3">النسبة المئوية</span>
                        <h1>59.69 %</h1>
                    </li>
                </ul>
            </div>
        </div>
    </div>
    <div class="clear"></div>
    <div class="full-result">
        <ul class="nav-pills mb-3" id="pills-tab" role="tablist">
            <li class="resultItem">
                <span class="formatt active" id="tab-list-active">الأسم:</span>
                <span>هاجر خالد محمد عثمان</span>
            </li>


            <li class="resultItem">
                <span class="formatt" id="tab">الترتيب :</span>
                <span>ناجح</span>
            </li>

            <li class="resultItem">
                <span class="formatt" id="tab">الترتيب مكرر :</span>
                <span>طلاب</span>
            </li>

        </ul>
    </div>
</div>




</body>
</html>
