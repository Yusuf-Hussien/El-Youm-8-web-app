<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:if="${student}" th:fragment="studentFragment(student,calledFromList)" class="RightSide">

    <!-- Navigation and Download buttons -->
    <div class="student-actions d-flex justify-content-between">


        <!-- PDF Download Button -->
        <div th:if="${student}">
            <form th:action="@{/natega/student/downloadPdf}" method="post" style="display: inline;">
                <input type="hidden" th:name="seatNumber" th:value="${student.seatNumber}">
                <input type="hidden" th:name="arabicName" th:value="${student.arabicName}">
                <input type="hidden" th:name="totalDegree" th:value="${student.totalDegree}">
                <input type="hidden" th:name="percentage" th:value="${student.percentage}">
                <input type="hidden" th:name="studentRank" th:value="${student.studentRank}">
                <input type="hidden" th:name="rankWithDuplicates" th:value="${student.rankWithDuplicates}">
                <button type="submit" class="btn btn-success">
                    <i class="fas fa-download"></i> تحميل النتيجة
                </button>
            </form>
        </div>

        <button th:if="${calledFromList}" onclick="window.history.back()" class="btn btn-secondary">
            ← العودة للقائمة
        </button>

    </div>

    <!-- Student Result -->
        <div class="halfinput-student">
            <h6>بيانات الطالب</h6>
        </div>
        <div class="data-result">
            <div class="halfinput-result">
                <div class="wrapper">
                    <ul class="nav nav-pills mb-3 d-flex justify-content-center" id="pills-tab" role="tablist">
                        <li class="col resultItem">
                            <span class="formatt3">رقم الجلوس</span>
                            <h1 th:text="${student.seatNumber}"></h1>
                        </li>
                        <li class="col resultItem">
                            <span class="formatt3">مجموع الدرجات</span>
                            <h1 th:text="${student.totalDegree}"></h1>
                        </li>
                        <li class="col resultItem">
                            <span class="formatt3">النسبة المئوية</span>
                            <h1 th:text="${student.percentage} + ' %'"></h1>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="clear"></div>
        <div class="full-result">
            <ul class="nav-pills mb-3" id="pills-tab" role="tablist">
                <li class="resultItem2">
                    <span class="formatt active" id="tab-list-active">الأسم: </span>
                    <span th:text="${student.arabicName}"></span>
                </li>
                <li class="resultItem2">
                    <span class="formatt" id="tab">الترتيب: </span>
                    <span th:text="${student.studentRank}"></span>
                </li>
                <li class="resultItem2">
                    <span class="formatt" id="tab"> الترتيب مكرر:</span>
                    <span th:text="${student.rankWithDuplicates}"></span>
                </li>
            </ul>
        </div>
    </div>
</body>
</html>
