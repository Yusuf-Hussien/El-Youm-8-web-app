<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:if="${students}" th:fragment="studentsTableFragment(students,searching)">
    <h6 th:if="${searching}" style="margin-top: 20px; text-align: center;">نتائج البحث</h6>

    <div style="margin-bottom: 15px; text-align: right;">
        <button id="downLoadAllBtn" class="btn btn-success">
            <i class="fas fa-download"></i> تحميل الجدول
        </button>
    </div>

    <div style="margin-bottom: 30px;">
        <table class="table">
            <thead>
            <tr>
                <th>#</th>
                <th>رقم الجلوس</th>
                <th>الاسم</th>
                <th style="text-align: center;">مجموع الدرجات</th>
                <th style="text-align: center;">النسبة المئوية</th>
                <th style="text-align: center;">الترتيب</th>
                <th style="text-align: center;">الترتيب مكرر</th>
                <th style="text-align: center;">التفاصيل</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="student , stat : ${students}">
                <td th:text="${stat.count}"></td>
                <td th:text="${student.seatNumber}"></td>
                <td th:text="${student.arabicName}"></td>
                <td th:text="${student.totalDegree}" style="text-align: center;"></td>
                <td th:text="${student.percentage} + ' %'" style="color: #0d6efd;font-weight: bold;text-align: center;"></td>
                <td th:text="${student.studentRank}" style="text-align: center;"></td>
                <td th:text="${student.rankWithDuplicates}" style="text-align: center;"></td>
                <td style="text-align: center;">
                    <form th:action="@{/natega/showStudentDetails}" method="post" style="display: inline;">
                        <input type="hidden" th:name="seatNumber" th:value="${student.seatNumber}">
                        <input type="hidden" th:name="arabicName" th:value="${student.arabicName}">
                        <input type="hidden" th:name="totalDegree" th:value="${student.totalDegree}">
                        <input type="hidden" th:name="percentage" th:value="${student.percentage}">
                        <input type="hidden" th:name="studentRank" th:value="${student.studentRank}">
                        <input type="hidden" th:name="rankWithDuplicates" th:value="${student.rankWithDuplicates}">
                        <button type="submit" class="btn btn-primary btn-sm">
                            عرض التفاصيل
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div th:if="${searching}" style="margin-bottom: 20px;">.</div>


    <form id="bulkPdfForm" action="/natega/students/downloadPdf" method="post" style="display: none;">
        <input type="hidden" name="studentData" id="studentData">
    </form>

    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {

            var studentsData = /*[[${students}]]*/ [];

            document.getElementById('downLoadAllBtn').addEventListener('click', function() {
                document.getElementById('studentData').value = JSON.stringify(studentsData);
                document.getElementById('bulkPdfForm').submit();
            });
        });
    </script>

</div>
</body>
</html>
